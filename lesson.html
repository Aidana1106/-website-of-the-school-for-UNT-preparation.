<!DOCTYPE html>
<html lang="kz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ENT-Bilim сабақ — Математика немесе Информатика сабағы">
    <title>Сабақ — ENT-Bilim</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .lesson-container {
            padding: 120px 0 80px;
            min-height: 100vh;
        }
        
        .lesson-header {
            margin-bottom: 32px;
        }
        
        .lesson-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        
        .lesson-meta {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .lesson-subject {
            display: inline-block;
            padding: 6px 16px;
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            font-weight: 600;
        }
        
        .lesson-subject.math {
            background: rgba(99, 102, 241, 0.1);
            color: #6366f1;
        }
        
        .lesson-subject.informatics {
            background: rgba(139, 92, 246, 0.1);
            color: #8b5cf6;
        }
        
        .lesson-teacher {
            color: var(--text-secondary);
            font-size: 0.9375rem;
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            margin-bottom: 32px;
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }
        
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .lesson-description {
            background: var(--bg-white);
            border-radius: var(--radius-xl);
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: var(--shadow-md);
        }
        
        .lesson-description h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        
        .lesson-description p {
            color: var(--text-secondary);
            line-height: 1.8;
            font-size: 1.0625rem;
        }
        
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: all var(--transition-base);
        }
        
        .back-button:hover {
            gap: 12px;
        }
        
        .loading {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        
        .loading-spinner {
            border: 4px solid var(--bg-gray-200);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <div class="container">
            <nav class="nav">
                <div class="logo">
                    <a href="index.html" class="logo-link">
                        <span class="logo-text">ENT-<span class="logo-accent">Bilim</span></span>
                    </a>
                </div>
                
                <ul class="nav-menu" id="navMenu">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">Басты бет</a>
                    </li>
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link">Жеке кабинет</a>
                    </li>
                    <li class="nav-item">
                        <a href="contacts.html" class="nav-link">Байланыс</a>
                    </li>
                </ul>
                
                <div class="nav-right">
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                        <span class="theme-icon theme-icon-light">☀️</span>
                        <span class="theme-icon theme-icon-dark">🌙</span>
                    </button>
                    
                    <div id="userInfo" style="display: flex; gap: 12px; align-items: center;">
                        <button class="btn btn-secondary" onclick="logout()">Шығу</button>
                    </div>
                </div>
            </nav>
        </div>
    </header>
    
    <div class="lesson-container">
        <div class="container">
            <a href="dashboard.html" class="back-button">
                ← Жеке кабинетке оралу
            </a>
            
            <div id="lessonContent">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Сабақ жүктелуде...</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/translations.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/lesson.js"></script>
</body>
</html>
