<!DOCTYPE html>
<html lang="kz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ENT-Bilim тест — Математика немесе Информатика тесті">
    <title>Тест — ENT-Bilim</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .test-container {
            padding: 120px 0 80px;
            min-height: 100vh;
        }
        
        .test-header {
            margin-bottom: 32px;
        }
        
        .test-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }
        
        .test-meta {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .test-subject {
            display: inline-block;
            padding: 6px 16px;
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            font-weight: 600;
        }
        
        .test-subject.math {
            background: rgba(99, 102, 241, 0.1);
            color: #6366f1;
        }
        
        .test-subject.informatics {
            background: rgba(139, 92, 246, 0.1);
            color: #8b5cf6;
        }
        
        .test-timer {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-gray-100);
            border-radius: var(--radius-full);
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .test-timer.warning {
            background: #fef3c7;
            color: #d97706;
        }
        
        .test-timer.danger {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .test-progress {
            background: var(--bg-white);
            border-radius: var(--radius-xl);
            padding: 24px;
            margin-bottom: 32px;
            box-shadow: var(--shadow-md);
        }
        
        .test-progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-gray-100);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-bottom: 12px;
        }
        
        .test-progress-fill {
            height: 100%;
            background: var(--gradient-primary);
            transition: width var(--transition-base);
        }
        
        .test-progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .test-content {
            background: var(--bg-white);
            border-radius: var(--radius-xl);
            padding: 32px;
            box-shadow: var(--shadow-md);
            margin-bottom: 32px;
        }
        
        .question-card {
            margin-bottom: 32px;
            padding-bottom: 32px;
            border-bottom: 2px solid var(--bg-gray-100);
        }
        
        .question-card:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }
        
        .question-number {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        .question-text {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .question-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--bg-gray-50);
            border: 2px solid var(--bg-gray-100);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--transition-base);
        }
        
        .option-item:hover {
            background: var(--bg-gray-100);
            border-color: var(--primary-color);
        }
        
        .option-item.selected {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--primary-color);
        }
        
        .option-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-secondary);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .option-item.selected .option-checkbox {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .option-item.selected .option-checkbox::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }
        
        .option-item.multiple .option-checkbox {
            border-radius: 4px;
        }
        
        .option-text {
            flex: 1;
            color: var(--text-primary);
            font-size: 1rem;
        }
        
        .test-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
            padding-top: 32px;
            border-top: 2px solid var(--bg-gray-100);
        }
        
        .test-actions {
            display: flex;
            gap: 12px;
        }
        
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: all var(--transition-base);
        }
        
        .back-button:hover {
            gap: 12px;
        }
        
        .loading {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        
        .loading-spinner {
            border: 4px solid var(--bg-gray-200);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .test-result {
            background: var(--bg-white);
            border-radius: var(--radius-xl);
            padding: 32px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }
        
        .result-score {
            font-size: 3rem;
            font-weight: 900;
            margin: 24px 0;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .result-passed {
            color: #10b981;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 24px;
        }
        
        .result-failed {
            color: #ef4444;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 24px;
        }
        
        .result-details {
            text-align: left;
            margin-top: 32px;
        }
        
        .result-question {
            padding: 16px;
            margin-bottom: 16px;
            border-radius: var(--radius-lg);
            border-left: 4px solid;
        }
        
        .result-question.correct {
            background: #d1fae5;
            border-left-color: #10b981;
        }
        
        .result-question.incorrect {
            background: #fee2e2;
            border-left-color: #ef4444;
        }
        
        /* Темная тема для тестов */
        [data-theme="dark"] .test-content,
        [data-theme="dark"] .test-progress,
        [data-theme="dark"] .test-result {
            background: #1f2937;
            color: var(--text-primary);
        }
        
        [data-theme="dark"] .option-item {
            background: #374151;
            border-color: #4b5563;
            color: var(--text-primary);
        }
        
        [data-theme="dark"] .option-item:hover {
            background: #4b5563;
        }
        
        [data-theme="dark"] .option-item.selected {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary-color);
        }
        
        [data-theme="dark"] .question-card {
            border-bottom-color: #4b5563;
        }
        
        [data-theme="dark"] .test-navigation {
            border-top-color: #4b5563;
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <div class="container">
            <nav class="nav">
                <div class="logo">
                    <a href="index.html" class="logo-link">
                        <span class="logo-text">ENT-<span class="logo-accent">Bilim</span></span>
                    </a>
                </div>
                
                <ul class="nav-menu" id="navMenu">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">Басты бет</a>
                    </li>
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link">Жеке кабинет</a>
                    </li>
                    <li class="nav-item">
                        <a href="contacts.html" class="nav-link">Байланыс</a>
                    </li>
                </ul>
                
                <div class="nav-right">
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                        <span class="theme-icon theme-icon-light">☀️</span>
                        <span class="theme-icon theme-icon-dark">🌙</span>
                    </button>
                    
                    <div id="userInfo" style="display: flex; gap: 12px; align-items: center;">
                        <button class="btn btn-secondary" onclick="logout()">Шығу</button>
                    </div>
                </div>
            </nav>
        </div>
    </header>
    
    <div class="test-container">
        <div class="container">
            <a href="dashboard.html" class="back-button">
                ← Жеке кабинетке оралу
            </a>
            
            <div id="testContent">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Тест жүктелуде...</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/translations.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/test.js"></script>
</body>
</html>
